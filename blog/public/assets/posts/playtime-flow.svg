<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" viewBox="0 0 760 430" role="img" aria-labelledby="title desc">
  <title id="title">Game playtime architecture</title>
  <desc id="desc">A Windows collector reads Steam and Modrinth totals and uploads them through a Vercel API to Neon PostgreSQL, with the website fetching public totals from that API.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1 9 5 1 9" fill="none" stroke="#b6b6bf" stroke-width="1.5"/></marker>
  </defs>
  <rect x="1" y="1" width="758" height="428" rx="16" fill="#101113" stroke="#29292e"/>
  <g fill="none" stroke="#b6b6bf" stroke-width="2" marker-end="url(#arrow)">
    <path d="M336 96H414"/>
    <path d="M574 150V266" marker-start="url(#arrow)"/>
    <path d="M186 270V216H470V154" marker-start="url(#arrow)"/>
  </g>
  <g font-family="Inter, system-ui, sans-serif" font-size="15" fill="#b6b6bf">
    <text x="372" y="71" text-anchor="middle">POST</text>
    <text x="594" y="213">Read / write</text>
    <text x="292" y="244" text-anchor="middle">GET /playtime</text>
  </g>
  <g fill="#18191c" stroke="#3a3a40">
    <rect x="36" y="42" width="300" height="108" rx="10"/>
    <rect x="424" y="42" width="300" height="108" rx="10"/>
    <rect x="36" y="270" width="300" height="108" rx="10"/>
    <rect x="424" y="270" width="300" height="108" rx="10"/>
  </g>
  <g font-family="Inter, system-ui, sans-serif" text-anchor="middle">
    <g fill="#ececee" font-size="23" font-weight="600">
      <text x="186" y="84">Windows collector</text>
      <text x="574" y="84">Vercel API</text>
      <text x="186" y="312">paryx.uk</text>
      <text x="574" y="312">Neon PostgreSQL</text>
    </g>
    <g fill="#b6b6bf" font-size="16">
      <text x="186" y="115">Steam + Modrinth</text>
      <text x="574" y="115">Authenticated uploads</text>
      <text x="186" y="343">Public minute totals</text>
      <text x="574" y="343">Cumulative source counters</text>
    </g>
  </g>
</svg>
