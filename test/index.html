<!DOCTYPE html>
<!-- keep editable configs at the top of each site's script, before functions or dom setup. keep css tokens at the top of the stylesheet. follow this for future sites too. -->
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Paryx testing</title>
  <meta name="description" content="Paryx's testing domain.">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0a0a0b">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400&family=Sora:wght@700&display=swap" rel="stylesheet">
  <script defer src="https://cdn.vercel-insights.com/v1/script.js"></script>

  <style>
    :root {
      --color-bg: #0a0a0b;
      --color-text: #ececee;
      --color-soft: #c9c9ce;
      --color-muted: #7d7d85;
      --color-line: rgba(255, 255, 255, 0.1);
      --color-grid: rgba(255, 255, 255, 0.05);
      --font-sans: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
      --text-display: clamp(2.25rem, 6vw, 4.5rem);
      --space-3: 0.75rem;
      --space-6: 1.5rem;
      --grid-size: 56px;
      --motion-slow: 1.4s;
      --ease: cubic-bezier(0.22, 1, 0.36, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      min-height: 100%;
    }

    body {
      background: var(--color-bg);
      color: var(--color-text);
      font-family: var(--font-sans);
      -webkit-font-smoothing: antialiased;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    :focus-visible {
      outline: 1px solid var(--color-text);
      outline-offset: 3px;
    }

    .grid {
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image:
        linear-gradient(to right, var(--color-grid) 1px, transparent 1px),
        linear-gradient(to bottom, var(--color-grid) 1px, transparent 1px);
      background-size: var(--grid-size) var(--grid-size);
      -webkit-mask-image: radial-gradient(ellipse 75% 70% at 50% 50%, #000 30%, transparent 100%);
      mask-image: radial-gradient(ellipse 75% 70% at 50% 50%, #000 30%, transparent 100%);
    }

    .grid::after {
      content: "";
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(to right, rgba(255, 255, 255, 0.14) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.14) 1px, transparent 1px);
      background-size: var(--grid-size) var(--grid-size);
      opacity: 0;
      -webkit-mask-image: radial-gradient(circle 135px at var(--mouse-x, -300px) var(--mouse-y, -300px), #000 0%, rgba(0, 0, 0, 0.95) 38%, transparent 78%);
      mask-image: radial-gradient(circle 135px at var(--mouse-x, -300px) var(--mouse-y, -300px), #000 0%, rgba(0, 0, 0, 0.95) 38%, transparent 78%);
      transition: opacity 160ms ease;
    }

    .grid.is-pointer-active::after {
      opacity: 1;
    }

    .hero {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: var(--space-6);
      padding: var(--space-6);
      text-align: center;
    }

    h1 {
      min-height: 1.1em;
      font-size: var(--text-display);
      font-weight: 300;
      letter-spacing: -0.03em;
      line-height: 1.1;
    }

    .hero-name {
      position: relative;
      font-family: "Sora", sans-serif;
      font-weight: 700;
      letter-spacing: 0;
    }

    .hero-name.is-pixel-typing {
      color: transparent;
    }

    .hero-name canvas {
      position: absolute;
      left: 0;
      pointer-events: none;
    }

    .line {
      width: 0;
      height: 1px;
      background: var(--color-line);
      transition: width 0.7s var(--ease);
    }

    .line.is-visible {
      width: 40px;
    }

    .rotator {
      min-height: 1.6em;
      color: var(--color-muted);
      font-weight: 300;
      letter-spacing: 0.01em;
      line-height: 1.6;
      opacity: 0;
      transform: translateY(8px);
      transition:
        opacity var(--motion-slow) var(--ease),
        transform var(--motion-slow) var(--ease);
    }

    .rotator.is-visible {
      opacity: 1;
      transform: none;
    }

    .caret {
      display: inline-block;
      width: 2px;
      height: 0.85em;
      margin-left: 0.12em;
      background: var(--color-text);
      vertical-align: -0.05em;
      opacity: 0.7;
    }

    .rotator .caret {
      height: 1em;
      background: var(--color-muted);
      vertical-align: -0.15em;
    }

    .caret.is-idle {
      animation: blink 1.1s steps(1) infinite;
    }

    .main-page {
      display: flex;
      align-items: center;
      gap: 0.35rem;
      color: var(--color-soft);
      font-size: 0.875rem;
      font-weight: 300;
      opacity: 0;
      transform: translateY(8px);
      transition:
        opacity 0.8s var(--ease),
        transform 0.8s var(--ease);
    }

    .main-page.is-visible {
      opacity: 1;
      transform: none;
    }

    .main-page a {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      color: var(--color-muted);
      border-bottom: 1px solid var(--color-line);
      transition: color 180ms ease;
    }

    .main-page a:hover {
      color: var(--color-text);
    }

    .main-page svg {
      width: 14px;
      height: 14px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.7;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    @keyframes blink {
      50% {
        opacity: 0;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .line,
      .rotator,
      .main-page {
        transition: none;
      }

      .caret.is-idle {
        animation: none;
      }
    }
  </style>
</head>

<body>
  <div class="grid" aria-hidden="true"></div>

  <section class="hero">
    <h1 aria-label="Hi, I'm paryx"><span id="type"></span><span class="caret" id="caret" aria-hidden="true"></span></h1>

    <div class="line" id="line" aria-hidden="true"></div>

    <p class="rotator" id="rotator">
      <span id="rot"></span><span class="caret" id="rotCaret" aria-hidden="true"></span>
    </p>

    <p class="main-page" id="mainPage">
      <span>My main page is</span>
      <a href="https://paryx.uk" aria-label="Visit paryx.uk">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M10 13a5 5 0 0 0 7.1.1l2-2a5 5 0 0 0-7.1-7.1l-1.1 1.1" />
          <path d="M14 11a5 5 0 0 0-7.1-.1l-2 2A5 5 0 0 0 12 20l1.1-1.1" />
        </svg>
        <span>paryx.uk</span>
      </a>
    </p>
  </section>

  <script>
const startPixelName = async (name) => {
  const palettes = [
    { text: "#f5f5f5", accent: "#5b8cff" },
    { text: "#d9ffe6", accent: "#2bff88" },
    { text: "#ffe4f1", accent: "#ff4fa3" },
    { text: "#fff0e0", accent: "#ff8a2b" },
  ];
  const typeInterval = 170;
  const trailTime = 550;
  const cursorLinger = 900;
  const loopPause = 2200;
  const nameElement = document.querySelector(".hero-name");
  nameElement.textContent = name;

  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;

  const canvas = document.createElement("canvas");
  canvas.setAttribute("aria-hidden", "true");
  nameElement.append(canvas);
  const context = canvas.getContext("2d");
  if (!context) return;

  let layout;
  let glyphPoints = [];
  let particles = [];
  let paletteIndex = 0;
  let startedAt = 0;
  let spawnedCount = 0;
  let finishedAt = 0;
  let firstCycleComplete;
  const firstCycle = new Promise((resolve) => { firstCycleComplete = resolve; });
  const clamp = (value) => Math.max(0, Math.min(1, value));

  const prepare = () => {
    const style = getComputedStyle(nameElement);
    const size = parseFloat(style.fontSize);
    const font = `${style.fontWeight} ${size}px ${style.fontFamily}`;
    const ratio = Math.min(devicePixelRatio || 1, 2);
    const buffer = document.createElement("canvas");
    const bufferContext = buffer.getContext("2d");
    bufferContext.font = font;
    const offsets = [0];
    for (let index = 1; index <= name.length; index++) {
      offsets.push(bufferContext.measureText(name.slice(0, index)).width);
    }
    const width = Math.ceil(offsets[name.length] + size * 0.4);
    const height = Math.ceil(size * 1.8);
    const baseline = size * 1.28;
    const pixel = Math.max(3, Math.round(size / 22));

    canvas.style.width = `${width}px`;
    canvas.style.height = `${height}px`;
    canvas.style.top = `${-size * 0.4}px`;
    canvas.width = Math.ceil(width * ratio);
    canvas.height = Math.ceil(height * ratio);
    context.setTransform(ratio, 0, 0, ratio, 0, 0);

    buffer.width = width;
    buffer.height = height;
    bufferContext.font = font;
    bufferContext.textBaseline = "alphabetic";
    bufferContext.fillText(name, 0, baseline);
    const pixels = bufferContext.getImageData(0, 0, width, height).data;
    glyphPoints = [...name].map((letter, index) => {
      const points = [];
      if (letter === " ") return points;
      for (let y = 0; y < height; y += pixel) {
        for (let x = Math.floor(offsets[index]); x < offsets[index + 1]; x += pixel) {
          if (pixels[(y * width + x) * 4 + 3] > 128) points.push([x, y]);
        }
      }
      return points;
    });
    layout = { width, height, size, font, offsets, baseline, pixel };
  };

  const spawnParticle = (index, now) => {
    const points = glyphPoints[index];
    if (!points.length) return;
    let point = points[Math.floor(Math.random() * points.length)];
    const other = points[Math.floor(Math.random() * points.length)];
    if (other[1] < point[1]) point = other;
    const palette = palettes[paletteIndex];
    particles.push({
      x: point[0],
      y: point[1] - Math.random() * layout.size * 0.12,
      velocityX: (Math.random() - 0.5) * 22,
      velocityY: -(60 + Math.random() * 150),
      born: now,
      life: 1000 + Math.random() * 1000,
      size: layout.pixel * (0.6 + Math.random() * 0.9),
      color: Math.random() < 2 / 3 ? palette.text : palette.accent,
    });
  };

  const draw = (now) => {
    const elapsed = now - startedAt;
    const visible = Math.min(name.length, Math.floor(elapsed / typeInterval) + 1);
    const palette = palettes[paletteIndex];
    const { width, height, size, font, offsets, baseline, pixel } = layout;
    context.clearRect(0, 0, width, height);
    context.font = font;
    context.textBaseline = "alphabetic";

    for (; spawnedCount < visible; spawnedCount++) {
      for (let count = 0; count < 14; count++) spawnParticle(spawnedCount, now);
    }
    for (let index = 0; index < visible; index++) {
      const age = elapsed - index * typeInterval;
      if (age < trailTime && Math.random() < 0.7) spawnParticle(index, now);
      const fade = clamp(age / 120);
      context.globalAlpha = fade;
      context.fillStyle = palette.text;
      context.fillText(name[index], offsets[index], baseline - (1 - fade) * 10);
    }
    context.globalAlpha = 1;

    const isTyping = visible < name.length || elapsed < name.length * typeInterval + cursorLinger;
    if (isTyping || Math.floor(elapsed / 520) % 2 === 0) {
      context.fillStyle = palette.accent;
      context.fillRect(offsets[visible] + size * 0.05, baseline - size * 0.78, size * 0.3, size * 0.8);
    }

    let alive = 0;
    for (const particle of particles) {
      const age = now - particle.born;
      if (age > particle.life) continue;
      alive++;
      const seconds = age / 1000;
      const remaining = 1 - age / particle.life;
      const x = Math.round((particle.x + particle.velocityX * seconds) / pixel) * pixel;
      const y = Math.round((particle.y + particle.velocityY * seconds) / pixel) * pixel;
      context.globalAlpha = remaining * remaining * 0.95;
      context.fillStyle = particle.color;
      context.fillRect(x, y, particle.size, particle.size);
    }
    context.globalAlpha = 1;
    if (particles.length > 500) particles = particles.filter((particle) => now - particle.born < particle.life);

    if (visible === name.length && elapsed >= name.length * typeInterval) firstCycleComplete();
    if (visible === name.length && alive === 0 && elapsed > name.length * typeInterval + trailTime + cursorLinger) {
      if (!finishedAt) finishedAt = now;
      if (now - finishedAt > loopPause) {
        paletteIndex = (paletteIndex + 1) % palettes.length;
        startedAt = now;
        spawnedCount = 0;
        finishedAt = 0;
        particles = [];
      }
    }
    requestAnimationFrame(draw);
  };

  await Promise.race([document.fonts.load("700 100px Sora").catch(() => {}), new Promise((resolve) => setTimeout(resolve, 2500))]);
  prepare();
  nameElement.classList.add("is-pixel-typing");
  startedAt = performance.now();
  requestAnimationFrame(draw);
  addEventListener("resize", () => {
    prepare();
    particles = [];
  });
  await firstCycle;
};
  </script>
  <script>
    const HERO_PREFIX = "Hi, I'm ";
    const HERO_NAME = "paryx";
    const TEST_TEXT = "This is my testing domain!";

    const $ = (id) => document.getElementById(id);
    const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
    const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;

    const typeInto = async (el, text, base, jitter, punctuationPause = 320) => {
      el.textContent = "";
      for (const char of text) {
        el.append(document.createTextNode(char));
        const punctuation = /[,.;!?]/.test(char) ? punctuationPause : 0;
        await sleep(base + Math.random() * jitter + punctuation);
      }
    };

    const runHero = async () => {
      const caret = $("caret");
      const line = $("line");
      const rotCaret = $("rotCaret");

      if (reduce) {
        $("type").textContent = HERO_PREFIX;
        const heroName = document.createElement("span");
        heroName.className = "hero-name";
        heroName.textContent = HERO_NAME;
        $("type").append(heroName);
        caret.hidden = true;
        line.classList.add("is-visible");
        $("rot").textContent = TEST_TEXT;
        rotCaret.style.display = "none";
        $("rotator").classList.add("is-visible");
        $("mainPage").classList.add("is-visible");
        return;
      }

      await sleep(700);
      await typeInto($("type"), HERO_PREFIX, 62, 72);
      const heroName = document.createElement("span");
      heroName.className = "hero-name";
      heroName.textContent = HERO_NAME;
      $("type").append(heroName);
      caret.hidden = true;
      await startPixelName(HERO_NAME);
      await sleep(140);

      line.classList.add("is-visible");
      $("rotator").classList.add("is-visible");
      await sleep(90);

      await typeInto($("rot"), TEST_TEXT, 65, 55);
      rotCaret.style.display = "none";
      await sleep(350);

      $("mainPage").classList.add("is-visible");
    };

    const initGridPointer = () => {
      const grid = document.querySelector(".grid");
      if (!grid || !matchMedia("(pointer: fine)").matches) return;

      let frame = 0;
      let x = -300;
      let y = -300;

      const paint = () => {
        frame = 0;
        grid.style.setProperty("--mouse-x", `${x}px`);
        grid.style.setProperty("--mouse-y", `${y}px`);
        grid.classList.add("is-pointer-active");
      };

      addEventListener("pointermove", (event) => {
        x = event.clientX;
        y = event.clientY;
        if (!frame) frame = requestAnimationFrame(paint);
      }, { passive: true });

      document.documentElement.addEventListener("mouseleave", () => {
        grid.classList.remove("is-pointer-active");
      });
    };

    runHero();
    initGridPointer();
  </script>
</body>

</html>
